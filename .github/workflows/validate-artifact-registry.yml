name: Validate Artifact Registry

on:
  pull_request:
    paths:
      - "artifact-registry.yaml"
      - "schemas/**"
      - "docs/artifacts/**"
      - "docs/protocols/**"
      - "docs/templates/**"
      - "docs/verification/**"
      - "docs/records/**"
      - "scripts/validate_artifact_registry.py"
      - "requirements-validation.txt"
      - ".github/workflows/validate-artifact-registry.yml"
  push:
    branches:
      - main
    paths:
      - "artifact-registry.yaml"
      - "schemas/**"
      - "docs/artifacts/**"
      - "docs/protocols/**"
      - "docs/templates/**"
      - "docs/verification/**"
      - "docs/records/**"
      - "scripts/validate_artifact_registry.py"
      - "requirements-validation.txt"
      - ".github/workflows/validate-artifact-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schema, metadata, and registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt

      - name: Validate artifact registry
        run: python scripts/validate_artifact_registry.py
